name: Release and Sign

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # Needed for keyless signing via OIDC

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Create Production Archive
        run: |
          tar -czf ${{ runner.temp }}/source.tar.gz --exclude=.git --exclude=node_modules --exclude=.next .
          mv ${{ runner.temp }}/source.tar.gz .

      - name: Sign Artifacts
        run: |
          cosign sign-blob --yes source.tar.gz \
            --output-signature source.tar.gz.sig \
            --output-certificate source.tar.gz.pem

      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: |
            source.tar.gz
            source.tar.gz.sig
            source.tar.gz.pem
          generate_release_notes: true
